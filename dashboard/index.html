<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NEMSIS v2</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --gold:  #D4AF37;
  --gold2: #F4E070;
  --dark:  #080808;
  --card:  #101010;
  --border:#1c1c1c;
  --green: #00e676;
  --red:   #ff1744;
  --text:  #e0e0e0;
  --dim:   #505050;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { background:var(--dark); color:var(--text); font-family:'Space Mono',monospace;
  font-size:13px; min-height:100vh; }

/* ── HEADER */
.header {
  position: sticky; top:0; z-index:100;
  background: rgba(8,8,8,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items:center; justify-content:space-between;
}
.logo { font-family:'Syne',sans-serif; font-size:18px; font-weight:800;
  letter-spacing:3px; color:var(--gold); }
.logo span { color:var(--dim); font-weight:700; }
.price-wrap { text-align:right; }
.price-val { font-size:20px; font-weight:700; color:#fff; }
.price-sym { font-size:9px; color:var(--gold); letter-spacing:2px; display:block; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--green);
  box-shadow:0 0 8px var(--green); animation:pulse 2s infinite; display:inline-block; }
.dot.off { background:var(--dim); box-shadow:none; animation:none; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

/* ── MAIN */
.main { padding:12px; display:flex; flex-direction:column; gap:10px; max-width:500px; margin:0 auto; }

/* ── CARDS */
.card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:14px; }
.card-title { font-size:9px; letter-spacing:3px; color:var(--gold); text-transform:uppercase;
  margin-bottom:10px; }

/* ── SIGNAL CARD */
.sig-empty { text-align:center; padding:30px 0; color:var(--dim); }
.sig-empty .icon { font-size:36px; margin-bottom:8px; }
.sig-big { font-family:'Syne',sans-serif; font-size:32px; font-weight:800; letter-spacing:2px; }
.sig-big.buy  { color:var(--green); } .sig-big.sell { color:var(--red); }
.sig-card-inner.buy  { border-left:3px solid var(--green); padding-left:10px; }
.sig-card-inner.sell { border-left:3px solid var(--red);   padding-left:10px; }

.levels { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:12px 0; }
.lev { background:#0a0a0a; border:1px solid var(--border); border-radius:6px;
  padding:10px 8px; text-align:center; }
.lev .lt { font-size:8px; color:var(--dim); letter-spacing:1px; }
.lev .lv { font-size:16px; font-weight:700; margin-top:3px; }
.lev.en .lv { color:#fff; }
.lev.tp .lv { color:var(--green); }
.lev.sl .lv { color:var(--red); }

.tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.tag { background:#0a0a0a; border:1px solid var(--border); border-radius:4px;
  padding:4px 8px; font-size:10px; color:var(--dim); }
.tag b { color:var(--text); }

.score-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.score-num { font-size:22px; font-weight:700; color:var(--gold); }
.score-bar { flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
.score-fill { height:100%; background:linear-gradient(90deg,var(--gold),var(--gold2));
  border-radius:3px; transition:width .5s; }

.mtf-row { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.mtf-cell { background:#0a0a0a; border:1px solid var(--border); border-radius:4px;
  padding:6px; text-align:center; }
.mtf-cell .mt { font-size:9px; color:var(--dim); } .mtf-cell .md { font-size:13px; margin-top:2px; }
.mtf-cell.bull { border-color:rgba(0,230,118,.3); }
.mtf-cell.bear { border-color:rgba(255,23,68,.3);  }

/* ── RISK */
.risk-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.risk-item { background:#0a0a0a; border:1px solid var(--border); border-radius:6px; padding:10px; }
.risk-k { font-size:9px; color:var(--dim); letter-spacing:1px; }
.risk-v { font-size:18px; font-weight:700; margin-top:4px; }
.ok { color:var(--green); } .warn { color:#ffab40; } .bad { color:var(--red); }

/* ── STATS */
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.stat-item { background:#0a0a0a; border:1px solid var(--border); border-radius:6px; padding:10px; }
.stat-k { font-size:9px; color:var(--dim); letter-spacing:1px; }
.stat-v { font-size:20px; font-weight:700; margin-top:4px; color:var(--gold); }

/* ── SIGNAL HISTORY */
.sig-list { display:flex; flex-direction:column; gap:6px; }
.sig-item { background:#0a0a0a; border:1px solid var(--border); border-radius:6px;
  padding:10px; display:flex; align-items:center; gap:10px; }
.sig-dir { font-family:'Syne',sans-serif; font-size:14px; font-weight:700; min-width:40px; }
.sig-dir.buy { color:var(--green); } .sig-dir.sell { color:var(--red); }
.sig-info { flex:1; }
.sig-entry { font-size:14px; font-weight:700; }
.sig-meta2 { font-size:10px; color:var(--dim); margin-top:2px; }
.sig-score2 { font-size:14px; color:var(--gold); font-weight:700; }

/* ── LOG */
.log-wrap { max-height:150px; overflow-y:auto; }
.log-line { font-size:11px; padding:3px 0; border-bottom:1px solid #111; color:var(--dim); }
.log-line:last-child { color:var(--gold2); }
.log-wrap::-webkit-scrollbar { width:3px; }
.log-wrap::-webkit-scrollbar-thumb { background:var(--border); }

/* ── LAST UPDATE */
.footer { text-align:center; padding:16px; font-size:10px; color:var(--dim); }

/* ── TABS (mobile nav) */
.tabs { position:fixed; bottom:0; left:0; right:0; z-index:100;
  background:rgba(8,8,8,0.97); border-top:1px solid var(--border);
  display:flex; }
.tab { flex:1; padding:12px 4px 10px; text-align:center; font-size:9px;
  letter-spacing:1px; color:var(--dim); cursor:pointer; text-transform:uppercase; }
.tab.active { color:var(--gold); border-top:2px solid var(--gold); }
.tab .ti { font-size:18px; display:block; margin-bottom:2px; }

.page { display:none; }
.page.active { display:flex; flex-direction:column; }
.main { padding-bottom:70px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">NEM<span>SIS</span></div>
  <div class="price-wrap">
    <span class="price-sym">XAU/USD <span class="dot" id="dot"></span></span>
    <div class="price-val" id="price">—</div>
  </div>
</div>

<div class="main">

  <!-- PAGE: SIGNAL -->
  <div class="page active" id="page-signal">
    <div class="card">
      <div class="card-title">Live Signal</div>
      <div id="sig-body">
        <div class="sig-empty">
          <div class="icon">◈</div>
          <div>Scanning market...</div>
          <div style="font-size:11px;margin-top:6px">London & NY sessions</div>
        </div>
      </div>
    </div>
  </div>

  <!-- PAGE: RISK + STATS -->
  <div class="page" id="page-risk">
    <div class="card">
      <div class="card-title">Risk Status</div>
      <div class="risk-grid" id="risk-grid"></div>
    </div>
    <div class="card" style="margin-top:10px">
      <div class="card-title">Statistics</div>
      <div class="stats-grid" id="stats-grid"></div>
    </div>
  </div>

  <!-- PAGE: HISTORY -->
  <div class="page" id="page-history">
    <div class="card">
      <div class="card-title">Signal History</div>
      <div class="sig-list" id="sig-list"></div>
    </div>
  </div>

  <!-- PAGE: LOG -->
  <div class="page" id="page-log">
    <div class="card">
      <div class="card-title">Bot Log</div>
      <div class="log-wrap"><div id="log-inner"></div></div>
    </div>
    <div class="footer" id="last-scan">Last scan: —</div>
  </div>

</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('signal',this)">
    <span class="ti">◈</span>Signal
  </div>
  <div class="tab" onclick="switchTab('risk',this)">
    <span class="ti">🛡</span>Risk
  </div>
  <div class="tab" onclick="switchTab('history',this)">
    <span class="ti">📋</span>History
  </div>
  <div class="tab" onclick="switchTab('log',this)">
    <span class="ti">🖥</span>Log
  </div>
</div>

<script>
// ── CONFIG — Supabase
const SB_URL = "https://xqinzjaqorjqaexeoyqc.supabase.co";
const SB_KEY = "sb_publishable_eGAHjERYuK9ztviFer41CQ_6FouGpQU";  // publishable key (safe for browser)

const headers = { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}` };

function switchTab(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  el.classList.add('active');
}

// ── RENDER SIGNAL
function renderSignal(sig) {
  if (!sig) {
    document.getElementById('sig-body').innerHTML = `
      <div class="sig-empty"><div class="icon">◈</div>
      <div>No signal</div>
      <div style="font-size:11px;margin-top:6px;color:var(--dim)">Active during London & NY sessions</div></div>`;
    return;
  }
  const d = sig.direction;
  const mtf = sig.mtf_detail || {};
  const mtfHtml = Object.entries(mtf).map(([tf,v]) => {
    const cls = v.includes('bull')?'bull':v.includes('bear')?'bear':'';
    const ic  = v.includes('bull')?'↑':v.includes('bear')?'↓':'→';
    return `<div class="mtf-cell ${cls}"><div class="mt">${tf}</div><div class="md">${ic}</div></div>`;
  }).join('');
  document.getElementById('sig-body').innerHTML = `
    <div class="sig-card-inner ${d}">
      <div class="sig-big ${d}">${d.toUpperCase()}</div>
      <div style="font-size:10px;color:var(--dim);margin:4px 0 10px">${sig.regime||''} · ${sig.session||''}</div>
      <div class="score-row">
        <div class="score-num">${sig.score}/100</div>
        <div class="score-bar"><div class="score-fill" style="width:${sig.score}%"></div></div>
      </div>
      <div class="levels">
        <div class="lev en"><div class="lt">ENTRY</div><div class="lv">${sig.entry}</div></div>
        <div class="lev tp"><div class="lt">TP</div><div class="lv">${sig.tp}</div></div>
        <div class="lev sl"><div class="lt">SL</div><div class="lv">${sig.sl}</div></div>
      </div>
      <div class="tags">
        <div class="tag">R:R <b>1:${sig.rr}</b></div>
        <div class="tag">RSI <b>${sig.rsi}</b></div>
        <div class="tag">ADX <b>${sig.adx}</b></div>
        <div class="tag">ATR <b>${sig.atr}</b></div>
      </div>
      <div class="mtf-row">${mtfHtml}</div>
    </div>`;
}

// ── RENDER RISK
function renderRisk(r) {
  if (!r) return;
  const ok = r.can_trade;
  document.getElementById('risk-grid').innerHTML = `
    <div class="risk-item"><div class="risk-k">BALANCE</div><div class="risk-v">$${(r.balance||0).toFixed(0)}</div></div>
    <div class="risk-item"><div class="risk-k">STATUS</div><div class="risk-v ${ok?'ok':'bad'}">${ok?'✅':'🚫'}</div></div>
    <div class="risk-item"><div class="risk-k">DAILY P&L</div><div class="risk-v ${(r.daily_pnl||0)>=0?'ok':'bad'}">${(r.daily_pnl||0)>=0?'+':''}$${(r.daily_pnl||0).toFixed(0)}</div></div>
    <div class="risk-item"><div class="risk-k">DRAWDOWN</div><div class="risk-v ${(r.drawdown_pct||0)<4?'ok':(r.drawdown_pct||0)<8?'warn':'bad'}">${(r.drawdown_pct||0).toFixed(1)}%</div></div>`;
}

// ── RENDER STATS
function renderStats(s) {
  if (!s || !s.total) {
    document.getElementById('stats-grid').innerHTML = '<div style="color:var(--dim);grid-column:1/-1">No trades yet</div>';
    return;
  }
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-item"><div class="stat-k">TRADES</div><div class="stat-v">${s.total}</div></div>
    <div class="stat-item"><div class="stat-k">WIN RATE</div><div class="stat-v ${s.win_rate>=50?'ok':'bad'}">${s.win_rate}%</div></div>
    <div class="stat-item"><div class="stat-k">PROF FACTOR</div><div class="stat-v">${s.profit_factor}</div></div>
    <div class="stat-item"><div class="stat-k">NET P&L</div><div class="stat-v ${(s.net_pnl||0)>=0?'ok':'bad'}">$${s.net_pnl}</div></div>`;
}

// ── RENDER SIGNAL HISTORY
function renderHistory(sigs) {
  if (!sigs || !sigs.length) {
    document.getElementById('sig-list').innerHTML = '<div style="color:var(--dim)">No signals yet</div>';
    return;
  }
  document.getElementById('sig-list').innerHTML = sigs.slice(0,20).map(s => `
    <div class="sig-item">
      <div class="sig-dir ${s.direction}">${(s.direction||'').toUpperCase()}</div>
      <div class="sig-info">
        <div class="sig-entry">${s.entry||'—'}</div>
        <div class="sig-meta2">TP:${s.tp||'—'} · SL:${s.sl||'—'} · ${(s.created_at||'').slice(11,16)}</div>
      </div>
      <div class="sig-score2">${s.score||'—'}</div>
    </div>`).join('');
}

// ── RENDER LOG
function renderLog(lines) {
  document.getElementById('log-inner').innerHTML = (lines||[]).map(l =>
    `<div class="log-line">${l}</div>`).join('');
}

// ── FETCH ALL DATA
async function refresh() {
  try {
    // Bot state
    const stateRes = await fetch(`${SB_URL}/rest/v1/bot_state?id=eq.1`, {headers});
    const stateArr = await stateRes.json();
    const state = stateArr[0] || {};

    document.getElementById('price').textContent = state.price || '—';
    document.getElementById('dot').className = 'dot' + (state.scanning ? '' : ' off');
    document.getElementById('last-scan').textContent = `Last scan: ${state.last_scan||'—'}`;

    renderRisk(state.risk);
    renderStats(state.stats);
    renderLog(state.log);

    // Latest signal
    const sigRes = await fetch(`${SB_URL}/rest/v1/signals?order=created_at.desc&limit=1`, {headers});
    const sigs = await sigRes.json();
    renderSignal(sigs[0] || null);

    // Signal history
    const histRes = await fetch(`${SB_URL}/rest/v1/signals?order=created_at.desc&limit=20`, {headers});
    const hist = await histRes.json();
    renderHistory(hist);

  } catch(e) {
    console.error(e);
  }
}

refresh();
setInterval(refresh, 5000);

// Add to home screen prompt handling
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
});
</script>
</body>
</html>
